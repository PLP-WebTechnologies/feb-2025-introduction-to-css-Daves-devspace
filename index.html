<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Styling Example</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1 class="main-heading">Welcome to My Styled Page</h1>

  <p id="intro">This is a basic webpage with external CSS styling. We are learning how to use selectors, padding, margins, and borders.</p>

  <img src="images/sample.png" alt="Sample" class="styled-image">

  <div class="box">
    <p>This box has padding, a border, and margin applied to it.</p>
  </div>

</body>
</html>
